server:
  port: 8082

spring:
  datasource:
    jdbcUrl: jdbc:mysql://localhost:3306/eatsdb?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        order_inserts: true
        jdbc:
          batch_size: 4

  ai:
    ollama:
      model: mistral
      base-url: http://localhost:11434

logging:
  level:
    org.springframework: INFO

roles:
  roles:
    Developer:
      - DB_READ
      - APP_READ
      - LOG_VIEW

    Admin:
      - DB_READ
      - DB_WRITE
      - APP_MANAGE
      - USER_MANAGE
      - LOG_VIEW
      - SYSTEM_CONFIG

    Intern:
      - APP_READ
      - DOC_VIEW

    Manager:
      - APP_READ
      - REPORT_VIEW
      - USER_APPROVE

    Auditor:
      - LOG_VIEW
      - REPORT_VIEW
      - COMPLIANCE_CHECK
