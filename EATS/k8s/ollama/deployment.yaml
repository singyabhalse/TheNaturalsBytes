apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: eats

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest

          ports:
            - containerPort: 11434

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"

            limits:
              memory: "4Gi"
              cpu: "2000m"
